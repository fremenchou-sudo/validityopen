function viewChapter(){
  const c = chBySlug(S.slug); if(!c) return viewHome();
  if(!S.progress[c.slug]){ S.progress[c.slug] = "VIEWED"; save(); }
  const i = DATA.indexOf(c);
  const prev = i>0 ? DATA[i-1] : null, next = i<DATA.length-1 ? DATA[i+1] : null;
  const isDone = S.progress[c.slug]==="COMPLETED";

  const qs = c.questions.map(q=>{
    const mine = S.responses.filter(r=>r.questionId===q.id);
    const past = mine.map((r,n)=>{
      const fb = r.fb;
      const block = (arr,cls,title) => arr.length ?
        '<div class="fb-b '+cls+'"><div class="fb-t">'+title+'</div><ul>'+
        arr.map(x=>'<li><b>'+esc(p(x.labelZh,x.labelEn))+'</b> — '+esc(p(x.msgZh,x.msgEn))+'</li>').join("")+'</ul></div>' : "";
      return '<div style="margin-bottom:18px">'+
        '<div class="muted" style="margin-bottom:6px">'+t("prevAns")+' #'+(n+1)+' · '+new Date(r.at).toLocaleString()+'</div>'+
        '<div class="ans">'+esc(r.text)+'</div>'+
        '<div class="muted" style="margin:12px 0 2px;font-size:12.5px;letter-spacing:.03em">'+t("ruleFb")+'</div>'+
        '<div class="fb">'+
          block(fb.hits,"fb-hit","✓ "+p("你已觸及的概念","Concepts you engaged"))+
          block(fb.flags,"fb-flag","⚠ "+p("值得澄清的概念","Worth clarifying"))+
          block(fb.gaps,"fb-gap","◌ "+p("可以再想想","Push further"))+
        '</div>'+
        renderAI(r)+'</div>';
    }).join("");

    const hint = (q.hintZh||q.hintEn) ?
      '<details style="margin:11px 0 0"><summary style="cursor:pointer;color:var(--accent);font-size:14px">'+t("hint")+'</summary>'+
      '<p class="muted" style="margin:8px 0 0;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:11px">'+
      esc(p(q.hintZh||"",q.hintEn||""))+'</p></details>' : "";

    return '<div class="card" style="padding:24px 26px">'+
      '<div style="display:flex;gap:13px;align-items:flex-start">'+
        '<span style="flex:none;width:34px;height:32px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600">Q'+q.order+'</span>'+
        '<p style="margin:0;font-weight:500;line-height:1.75">'+esc(p(q.promptZh,q.promptEn))+'</p></div>'+
      hint+
      (past?'<div style="margin-top:20px">'+past+'</div>':"")+
      '<div style="margin-top:16px">'+
        '<textarea data-q="'+q.id+'" placeholder="'+t("yours")+'"></textarea>'+
        '<div class="muted" data-err="'+q.id+'" style="color:#c0392b;margin-top:6px;display:none"></div>'+
        '<div style="margin-top:11px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">'+
          '<button class="btn" data-submit="'+q.id+'">'+(mine.length?t("again"):t("submit"))+'</button>'+
          '<span class="muted">'+p("回答會儲存在你的瀏覽器，並即時分析","Saved in your browser and analyzed instantly")+'</span>'+
        '</div></div></div>';
  }).join("");

  return '<div style="margin-bottom:20px"><a href="#" data-go="home" class="muted" style="text-decoration:none">← '+t("back")+'</a></div>'+
    '<header style="margin-bottom:26px">'+
      '<div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px">'+
        '<span class="chip c-acc">'+t("ch")+' '+c.order+'</span>'+
        '<span class="chip c-nil">'+esc(c.speaker)+'</span>'+
        '<span class="chip c-nil">'+c.minutes+' '+t("min")+'</span></div>'+
      '<h1 style="font-size:clamp(26px,4.4vw,34px)">'+esc(p(c.titleZh,c.titleEn))+'</h1>'+
      '<p style="font-size:17.5px;color:var(--ink-soft);margin:13px 0 0">'+esc(p(c.summaryZh,c.summaryEn))+'</p>'+
    '</header>'+
    '<article class="card ct" style="padding:28px 30px">'+renderContent(p(c.contentZh,c.contentEn))+'</article>'+
    '<section style="margin-top:44px">'+
      '<h2 style="font-size:22px;margin-bottom:7px">'+t("reflect")+'</h2>'+
      '<p class="muted" style="margin:0 0 20px">'+
        p("沒有標準答案——這些問題是為了幫助你把概念連結到自己的教學現場。","No model answers — these questions connect the concepts to your own teaching practice.")+'</p>'+
      '<div class="stack" style="gap:18px">'+qs+'</div></section>'+
    '<div class="card" style="margin-top:40px;padding:20px 24px;display:flex;gap:11px;align-items:center;flex-wrap:wrap">'+
      (isDone ? '<span class="chip c-acc" style="padding:8px 16px">✓ '+t("marked")+'</span>'
              : '<button class="btn" data-done="'+c.slug+'">'+t("mark")+'</button>')+
      '<span style="margin-left:auto;display:flex;gap:9px;flex-wrap:wrap">'+
        (prev?'<a href="#" data-ch="'+prev.slug+'" class="btn btn-o" style="text-decoration:none">← '+t("prev")+'</a>':"")+
        '<a href="#" data-go="home" class="btn btn-q" style="text-decoration:none">'+t("back")+'</a>'+
        (next?'<a href="#" data-ch="'+next.slug+'" class="btn btn-o" style="text-decoration:none">'+t("next")+' →</a>':"")+
      '</span></div>';
}

function viewDash(){
  const rs = S.responses;
  const hot = [], cov = [];
  DATA.forEach(c=>c.questions.forEach(q=>{
    const rows = rs.filter(r=>r.questionId===q.id);
    if(!rows.length) return;
    (q.rubric.misconceptions||[]).forEach(m=>{
      const n = rows.filter(r=>r.fb.flags.some(f=>f.key===m.key)).length;
      if(n) hot.push({label:p(m.labelZh,m.labelEn), ch:c, q, n, total:rows.length});
    });
    (q.rubric.concepts||[]).forEach(cc=>{
      const n = rows.filter(r=>r.fb.hits.some(h=>h.key===cc.key)).length;
      cov.push({label:p(cc.labelZh,cc.labelEn), ch:c, q, n, total:rows.length});
    });
  }));
  hot.sort((a,b)=>b.n/b.total - a.n/a.total);

  const empty = rs.length===0;
  const tiles = '<div class="tiles" style="margin-bottom:30px">'+
    '<div class="card tile"><div class="tile-n">'+rs.length+'</div><div class="tile-l">'+p("反思回應","Responses")+'</div></div>'+
    '<div class="card tile"><div class="tile-n">'+new Set(rs.map(r=>r.questionId)).size+' / '+allQ().length+'</div><div class="tile-l">'+p("已作答題數","Questions answered")+'</div></div>'+
    '<div class="card tile"><div class="tile-n">'+hot.reduce((a,h)=>a+h.n,0)+'</div><div class="tile-l">'+p("誤區訊號","Misconception flags")+'</div></div>'+
    '<div class="card tile"><div class="tile-n">'+DATA.filter(c=>S.progress[c.slug]==="COMPLETED").length+' / '+DATA.length+'</div><div class="tile-l">'+p("完成章節","Chapters completed")+'</div></div>'+
  '</div>';

  const hotBox = '<section style="margin-bottom:32px"><h2 style="font-size:20px;margin-bottom:5px">⚠ '+p("常見誤區雷達","Misconception radar")+'</h2>'+
    '<p class="muted" style="margin:0 0 14px">'+p("依觸發比例排序：回答中出現特定誤解模式的比例","Sorted by trigger rate: share of answers matching a misconception pattern")+'</p>'+
    '<div class="card" style="padding:18px 24px">'+
    (hot.length ? hot.map(h=>meter(esc(h.label)+' <span class="muted">— '+esc(p(h.ch.titleZh,h.ch.titleEn))+' Q'+h.q.order+'</span>', h.n/h.total, h.n+"/"+h.total, "orange")).join("")
                : '<p class="muted" style="margin:0">'+p("目前沒有誤區訊號。","No misconception signals yet.")+'</p>')+
    '</div></section>';

  const covBox = '<section style="margin-bottom:32px"><h2 style="font-size:20px;margin-bottom:14px">'+p("概念掌握熱度","Concept coverage")+'</h2>'+
    '<div class="stack" style="gap:15px">'+
    DATA.map(c=>{
      const items = cov.filter(x=>x.ch===c);
      if(!items.length) return "";
      return '<div class="card" style="padding:20px 24px">'+
        '<div style="font-family:var(--display);font-weight:600;margin-bottom:10px">'+t("ch")+' '+c.order+'・'+esc(p(c.titleZh,c.titleEn))+'</div>'+
        items.map(x=>meter(esc(x.label)+' <span class="muted">Q'+x.q.order+'</span>', x.total?x.n/x.total:0, x.n+"/"+x.total, "teal")).join("")+'</div>';
    }).join("")+'</div></section>';

  const recent = rs.slice().reverse().slice(0,10).map(r=>{
    const q = allQ().find(x=>x.id===r.questionId); if(!q) return "";
    return '<div style="padding:16px 22px">'+
      '<div class="muted" style="margin-bottom:5px">'+esc(p(q.ch.titleZh,q.ch.titleEn))+' Q'+q.order+' · '+new Date(r.at).toLocaleString()+
        ' <span class="chip c-acc" style="margin-left:6px">'+p("概念","concepts")+' '+r.fb.hits.length+(r.fb.flags.length?' · ⚠ '+r.fb.flags.length:"")+'</span></div>'+
      '<div style="color:var(--ink-soft);font-size:14.5px;white-space:pre-wrap">'+esc(r.text)+'</div></div>';
  }).join("");

  return '<div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px">'+
      '<h1 style="font-size:30px">'+t("dash")+'</h1>'+
      '<button class="btn btn-o" id="csvBtn">⬇ '+p("下載 CSV","Export CSV")+'</button></div>'+
    '<p class="muted" style="margin:0 0 22px;max-width:44em">'+
      p("這裡分析的是<b>你在這台裝置上的作答</b>。正式版（本機全端系統）會彙整所有學習者的回應，並可接上 Claude API 做深度誤解分析。",
        "This analyzes <b>your own answers on this device</b>. The full local system aggregates all learners and can call the Claude API for deep misconception analysis.")+'</p>'+
    (empty ? '<div class="notice" style="margin-bottom:26px"><span>◔</span><span>'+
        p("尚無資料。切換到<b>學員</b>視角、進任一章作答一題，統計就會即時出現在這裡——那個閉環正是這套系統的核心。",
          "No data yet. Switch to the <b>Learner</b> view, answer one reflection in any chapter, and the analytics appear here — that closed loop is the core of this system.")+
      '</span></div>' : "")+
    tiles + hotBox + covBox +
    (recent ? '<section><h2 style="font-size:20px;margin-bottom:14px">'+p("最新回應","Recent responses")+'</h2>'+
      '<div class="card rowlist stack">'+recent+'</div></section>' : "");
}

function viewKB(){

      qs+'</div>';
  }).join("");

  const totalVetted = allQ().reduce((a,q)=>a+kbFor(q.id).length, 0);

  return '<div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap">'+

      p("AI 回饋的依據有三層：<b>章節內容</b>（已內建）、<b>回饋規則</b>（概念與誤區，已內建）、<b>你審定的知識</b>（下方新增）。審定知識越充足，AI 回饋越貼近你的立場、越少依賴模型自身知識。",

    '<div class="tiles" style="margin-bottom:24px">'+
      '<div class="card tile"><div class="tile-n">'+totalVetted+'</div><div class="tile-l">'+p("審定知識則數","Vetted excerpts")+'</div></div>'+
      '<div class="card tile"><div class="tile-n">'+allQ().length+'</div><div class="tile-l">'+p("反思題","Questions")+'</div></div>'+
      '<div class="card tile"><div class="tile-n">32</div><div class="tile-l">'+p("概念規則","Concept rules")+'</div></div>'+
      '<div class="card tile"><div class="tile-n" style="color:'+(thin?"var(--viz-orange)":"inherit")+'">'+thin+'</div><div class="tile-l">'+p("偏薄的題目","Thin questions")+'</div></div>'+

/* ── render ─────────────────────────────── */
function render(){
  document.documentElement.lang = S.lang==="zh" ? "zh-Hant-TW" : "en";
  document.getElementById("brandT").textContent = t("site");
  document.getElementById("langBtn").textContent = t("lang");
  renderRoleSeg(); renderNav();

  const v = document.getElementById("view");
  const wide = ["dash","content","editor","roles","kb"].includes(S.view);
  let html;
  if(S.view==="chapter") html = viewChapter();
  else if(S.view==="profile") html = viewProfile();
  else if(S.view==="dash") html = viewDash();
  else if(S.view==="content") html = viewContent();
  else if(S.view==="editor") html = viewEditor();
  else if(S.view==="roles") html = viewRoles();
  else if(S.view==="kb") html = viewKB();
  else if(S.view==="settings") html = viewSettings();
  else html = viewHome();

  const banner = '<div class="notice" style="margin-bottom:26px"><span aria-hidden>◈</span><span>'+
    p("回饋分兩層：<b>規則回饋</b>是確定性的——同一組概念命中就給同一段預寫文字，所以會重複，且永遠免費可用；<b>AI 個別化回饋</b>讀你實際寫的內容生成，每次都不同，需先在「AI 設定」接上模型。學習紀錄只存在你自己的瀏覽器，不會上傳。",
      "Feedback comes in two layers. <b>Rule-based feedback</b> is deterministic — the same matched concepts always yield the same pre-written text, so it repeats; it always works and costs nothing. <b>AI feedback</b> is written from what you actually wrote, different every time, once a model is connected in AI settings. Your record stays in your own browser and is never uploaded.")+
    '</span></div>';

  v.className = wide ? "wrap-wide" : "wrap";
  const showBanner = S.view === "home" || S.view === "dash";
  v.innerHTML = (showBanner ? banner : "") + html;
  window.scrollTo({top:0, behavior:"instant"});
}

/* ── events ─────────────────────────────── */
document.addEventListener("change", e => {
  if(e.target && e.target.id === "ai-mode"){
    const m = e.target.value;
    const show = (id, on) => { const el = document.getElementById(id); if(el) el.style.display = on ? "" : "none"; };
    show("ai-key-box",   m === "key");
    show("ai-proxy-box", m === "proxy");
    show("ai-model-box", m !== "off");
  }
});

document.addEventListener("click", e => {
  const roleB = e.target.closest("[data-role]");
  if(roleB){ S.role = roleB.dataset.role;
    S.view = S.role==="LEARNER" ? "home" : "dash"; save(); render(); return; }

  const go = e.target.closest("[data-go]");
  if(go){ e.preventDefault(); S.view = go.dataset.go; save(); render(); return; }

  const ch = e.target.closest("[data-ch]");
  if(ch){ e.preventDefault(); S.slug = ch.dataset.ch; S.view = "chapter"; save(); render(); return; }

  const ed = e.target.closest("[data-edit]");
  if(ed){ e.preventDefault(); S.slug = ed.dataset.edit; S.view = "editor"; save(); render(); return; }

  const dn = e.target.closest("[data-done]");
  if(dn){ S.progress[dn.dataset.done] = "COMPLETED"; save(); render(); return; }

  const aiB = e.target.closest("[data-ai]");
  if(aiB){ runAI(aiB.dataset.ai); return; }

  const aiS = e.target.closest("[data-aistop]");
  if(aiS){ const c = aiCtl[aiS.dataset.aistop]; if(c) c.abort(); return; }

  const kbAdd = e.target.closest("[data-kbadd]");
  if(kbAdd){
    const qid = kbAdd.dataset.kbadd;
    const src = document.querySelector('[data-ksrc="'+qid+'"]').value.trim();
    const txt = document.querySelector('[data-ktext="'+qid+'"]').value.trim();
    if(txt.length < 10) return;
    S.kb = S.kb || {}; S.kb[qid] = S.kb[qid] || [];
    S.kb[qid].push({source:src, text:txt});
    save(); render(); return;
  }

  const kbDel = e.target.closest("[data-kbdel]");
  if(kbDel){
    const [qid, idx] = kbDel.dataset.kbdel.split("|");
    if(S.kb && S.kb[qid]) S.kb[qid].splice(Number(idx), 1);
    save(); render(); return;
  }

  if(e.target.closest("#aiSave")){ saveAiCfg(); return; }
  if(e.target.closest("#aiTest")){ testAiCfg(); return; }

  if(e.target.closest("#kbExport")){ exportKB(); return; }
  if(e.target.closest("#kbImport")){ importKB(); return; }

  const sb = e.target.closest("[data-submit]");
  if(sb){
    const id = sb.dataset.submit;
    const ta = document.querySelector('textarea[data-q="'+id+'"]');
    const err = document.querySelector('[data-err="'+id+'"]');
    const text = ta.value.trim();
    if(text.length < 5){ err.textContent = t("short"); err.style.display="block"; ta.focus(); return; }
    const q = allQ().find(x=>x.id===id);
    const rid = "r"+Date.now();
    S.responses.push({ id:rid, questionId:id, text, lang:S.lang, at:Date.now(), fb:analyze(text, q.rubric) });
    save(); render();
    if(aiReady()) runAI(rid);         // individualized feedback right after the deterministic pass
    return;
  }

  if(e.target.closest("#saveCh")){
    const c = chBySlug(S.slug);
    c.titleZh = document.getElementById("e-titleZh").value;
    c.titleEn = document.getElementById("e-titleEn").value;
    c.summaryZh = document.getElementById("e-sumZh").value;
    c.summaryEn = document.getElementById("e-sumEn").value;
    if(S.lang==="zh") c.contentZh = document.getElementById("e-content").value;
    else c.contentEn = document.getElementById("e-content").value;
    S.view = "content"; render();
    return;
  }

  if(e.target.closest("#csvBtn")){ exportCsv(); return; }

  if(e.target.closest("#langBtn")){ S.lang = S.lang==="zh" ? "en" : "zh"; save(); render(); return; }
});

/* ── AI settings ─────────────────────────── */
function readAiForm(){
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
  return {
    mode: g("ai-mode") || "off",
    key: g("ai-key"),
    endpoint: g("ai-endpoint"),
    model: g("ai-model") || DEFAULT_MODEL
  };
}
function saveAiCfg(){
  S.ai = readAiForm(); save();
  const m = document.getElementById("aiMsg");
  if(m){ m.textContent = "✓ " + t("cfgSaved"); m.style.color = "var(--accent-deep)"; }
}
async function testAiCfg(){
  S.ai = readAiForm(); save();
  const m = document.getElementById("aiMsg");
  if(!aiReady()){ m.textContent = aiCopy("unconfigured"); m.style.color = "var(--amber)"; return; }
  m.textContent = "…"; m.style.color = "var(--ink-faint)";
  try{
    await aiJson('Reply with only this JSON: {"ok":true}');
    m.textContent = "✓ " + t("cfgOk"); m.style.color = "var(--accent-deep)";
  }catch(err){
    m.textContent = aiCopy(err && err.code); m.style.color = "var(--amber)";
  }
}

/* ── CSV / knowledge-pack export ─────────── */
function csvText(){
  const head = ["chapter_order","chapter","question_order","question","answered_at","lang","answer","concepts_hit","concepts_missing","misconception_flags","score"];
  const q = s => '"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const lines = [head.join(",")];
  S.responses.forEach(r=>{
    const qq = allQ().find(x=>x.id===r.questionId); if(!qq) return;
    lines.push([qq.ch.order, qq.ch.titleEn, qq.order, qq.promptEn, new Date(r.at).toISOString(), r.lang, r.text,
      r.fb.hits.map(h=>h.key).join("; "), r.fb.gaps.map(g=>g.key).join("; "),
      r.fb.flags.map(f=>f.key).join("; "), Math.round(r.fb.score*100)/100].map(q).join(","));
  });
  return "\uFEFF" + lines.join("\r\n");
}

function offerFile(btnId, filename, data, emptyMsg){
  const btn = document.getElementById(btnId);
  if(emptyMsg){ btn.textContent = emptyMsg; setTimeout(()=>render(),1800); return; }
  try{
    const blob = new Blob([data], {type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/json;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    btn.textContent = "✓ " + p("已下載","Saved"); setTimeout(()=>render(),1800);
  }catch(err){
    btn.textContent = p("下載失敗","Export failed"); setTimeout(()=>render(),2000);
  }
}

function exportCsv(){
  return offerFile("csvBtn", "validity-lab-responses.csv", csvText(),
    S.responses.length ? null : p("目前沒有資料可下載","No data to export"));
}

function exportKB(){
  const pack = {};
  allQ().forEach(q => { const own = (S.kb && S.kb[q.id]) || []; if(own.length) pack[q.id] = own; });
  const n = Object.keys(pack).length;
  return offerFile("kbExport", "validity-lab-knowledge.json",
    JSON.stringify(pack, null, 2),
    n ? null : p("尚未新增審定知識","No vetted knowledge added yet"));
}

function importKB(){
  const raw = prompt(p("貼上先前匯出的知識庫 JSON：","Paste a previously exported knowledge JSON:"));
  if(!raw) return;
  try{
    const obj = JSON.parse(raw);
    if(!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error("shape");
    S.kb = S.kb || {};
    Object.keys(obj).forEach(qid => {
      if(!Array.isArray(obj[qid])) return;
      const clean = obj[qid]
        .filter(k => k && typeof k.text === "string" && k.text.trim())
        .map(k => ({source:String(k.source||""), text:String(k.text)}));
      if(clean.length) S.kb[qid] = (S.kb[qid]||[]).concat(clean);
    });
    save(); render();
  }catch(e){
    alert(p("JSON 格式不正確，未匯入。","That JSON could not be read — nothing was imported."));
  }
}

render();
